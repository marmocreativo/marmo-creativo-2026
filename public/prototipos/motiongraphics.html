// ===================== H HELPER LIBRARY (sin cambios) =====================
(function () {
  const STYLES = (window.STYLES = window.STYLES || []);
  window.registerStyle = (s) => STYLES.push(s);

  const H = (window.H = {});

  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    const fbm3 = (x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; } return s / norm; };
    const fbm2 = (x, y, oct = 4) => fbm3(x, y, 0.5, oct);
    return { n2, n3, fbm2, fbm3 };
  };

  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.map = (v, a, b, c, d) => c + ((v - a) / (b - a)) * (d - c);
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };

  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.mix = (c1, c2, t) => { const a = Array.isArray(c1) ? c1 : H.hex(c1), b = Array.isArray(c2) ? c2 : H.hex(c2); return [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t); };

  H.layer = (W, H_, ) => { const c = document.createElement('canvas'); c.width = W; c.height = H_; return c; };
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      if (mono) { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      else { d[i] += (r() - 0.5) * k; d[i + 1] += (r() - 0.5) * k; d[i + 2] += (r() - 0.5) * k; }
    }
    ctx.putImageData(img, 0, 0);
  };
  H.paper = function (ctx, W, Hh, base = '#f3ecdc', seed = 3, strength = 0.06) {
    ctx.save(); ctx.fillStyle = base; ctx.fillRect(0, 0, W, Hh);
    const nz = H.makeNoise(seed), cell = 4, [br, bg, bb] = H.hex(base);
    for (let y = 0; y < Hh; y += cell) for (let x = 0; x < W; x += cell) {
      const v = nz.fbm2(x * 0.01, y * 0.01, 3) * 0.6 + nz.n2(x * 0.15, y * 0.04) * 0.4;
      const s = 1 + v * strength * 2;
      ctx.fillStyle = `rgb(${br * s | 0},${bg * s | 0},${bb * s | 0})`; ctx.fillRect(x, y, cell, cell);
    }
    ctx.restore();
  };
  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
    ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); ctx.restore();
  };

  H.W = 1280; H.H = 720;
  H.loadFonts = async function (style) {
    const specs = style.fonts || [];
    try { const sample = 'AaZz09' + (window.FONT_SAMPLE || '');
      await Promise.all(specs.map((f) => document.fonts.load(f, sample))); await document.fonts.ready; } catch (e) { /* render anyway */ }
  };
  H.render = function (style, canvas, t) {
    const ctx = canvas.getContext('2d', { willReadFrequently: !!style.readsPixels });
    const sx = canvas.width / H.W, sy = canvas.height / H.H;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(sx, sy);
    style.draw(ctx, H.W, H.H, t == null ? style.frameT || 0 : t);
    ctx.restore();
  };
})();

<script>
// sound.js: a small synthesized sound kit for the style explainers. Plain Web Audio, no audio files.
// Voiceover mode: SOUND.kit(ctx, { voiceover: true }) drops beds and music, plays anything marked minor
// (play(..., { minor: true }), tone/noise { minor: true }, or scheduled inside k.withMinor(() => ...)) at about 60%
// volume instead of full, and sits all effects a little lower, so the narration stays on top while the piece still
// sounds alive. In the full mix, minor sounds play at full volume. Scores can read k.vo to branch further.
// A style adds   explainerSound(k) { k.bed('room', 0, D); k.play('pop', 1.25); ... }   and the same
// call schedules into a live AudioContext (the player) or an OfflineAudioContext (the video render).
// Times are seconds on the explainer's own clock. Randomness is seeded, so every render is identical.
(function () {
  'use strict';
  const SOUND = (window.SOUND = {});
  const TINY = 1e-4;

  // seeded random in [0,1), keyed by any string
  function rand(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0 || 1;
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // note names to Hz: 'A4' = 440, 'C#5', 'Eb3'
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const semis = STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12 - 9;
    return 440 * Math.pow(2, semis / 12);
  }
  SOUND.hz = hz;

  SOUND.kit = function (ctx, opts) {
    const o = opts || {};
    const VO = !!o.voiceover;
    const MINOR = 0.6; // voiceover-mode volume for minor sounds
    let inMinor = false;
    const gainOf = (p, d) => (p.gain == null ? d : p.gain) * (VO && (p.minor || inMinor) ? MINOR : 1);
    const T0 = (o.start || 0) - 0; // explainer time that maps to ctx time `base`
    const base = ctx.currentTime + (o.delay || 0);
    // Start times snap to the sample grid (+ a quarter sample): in Chrome a source started a hair off the grid can
    // spike to about twice its set level.
    const SR = ctx.sampleRate;
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.25) / SR;

    // ---- buses: sfx, amb, music -> compressor -> master; one shared reverb send
    const master = ctx.createGain(); master.gain.value = o.master == null ? 0.9 : o.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }

    // generated room reverb: decaying stereo noise, darker toward the tail
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const r = rand('verb' + c), d = ir.getChannelData(c); let lp = 0;
        for (let i = 0; i < n; i++) { const u = i / n; lp += (0.6 - 0.45 * u) * ((r() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - u, 3); }
      }
      verb.buffer = ir;
    }
    const verbIn = ctx.createGain(); verbIn.gain.value = 0.9; verbIn.connect(verb); verb.connect(comp);

    // seeded noise buffers: white, pink-ish and brown
    const noiseBuf = {};
    {
      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;
        for (let i = 0; i < n; i++) {
          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { p0 = 0.997 * p0 + 0.029 * w; p1 = 0.985 * p1 + 0.032 * w; p2 = 0.95 * p2 + 0.048 * w; d[i] = (p0 + p1 + p2 + w * 0.05) * 2.2; }
          else { br = (br + 0.02 * w) / 1.02; d[i] = br * 3.2; }
        }
        noiseBuf[kind] = b;
      }
    }

    // ---- automation helpers
    // a value or [[dt, value], ...] from the voice start; ramps are exponential (frequencies)
    function sweep(param, v, t) {
      if (!Array.isArray(v)) { param.setValueAtTime(v, t); return; }
      param.setValueAtTime(v[0][1], t + v[0][0]);
      for (let i = 1; i < v.length; i++) param.exponentialRampToValueAtTime(Math.max(v[i][1], 1), t + v[i][0]);
    }
    // amplitude: linear attack to `gain`, optional hold, exponential release to silence by `dur`
    function shape(param, t, gain, dur, a, hold) {
      a = Math.min(a == null ? 0.004 : a, dur * 0.9);
      hold = Math.min(hold || 0, dur - a);
      param.setValueAtTime(0, t);
      param.linearRampToValueAtTime(gain, t + a);
      if (hold > 0) param.setValueAtTime(gain, t + a + hold);
      param.exponentialRampToValueAtTime(TINY, t + dur);
      param.setValueAtTime(0, t + dur + 0.001);
    }
    function out(node, p) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, p.pan || 0));
      node.connect(pan); pan.connect(bus[p.bus || 'sfx']);
      if (p.verb) { const s = ctx.createGain(); s.gain.value = p.verb; pan.connect(s); s.connect(verbIn); }
    }
    function filterNode(p, t) {
      if (!p.filter) return null;
      const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 1 : p.q;
      sweep(f.frequency, p.f == null ? 1000 : p.f, t);
      return f;
    }

    // ---- primitives
    // tone(t, { f, type, dur, gain, a, hold, pan, verb, bus, filter, f2 (filter freq), q, detune })
    function tone(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const osc = ctx.createOscillator(); osc.type = p.type || 'sine';
      sweep(osc.frequency, Array.isArray(p.f) ? p.f.map(([d, v]) => [d, hz(v)]) : hz(p.f || 440), t);
      if (p.detune) osc.detune.value = p.detune;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      let node = osc;
      if (p.filter) { const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 0.8 : p.q; sweep(f.frequency, p.f2 || 2000, t); osc.connect(f); node = f; }
      node.connect(g); out(g, p);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    // noise(t, { dur, color, filter, f, q, gain, a, hold, pan, verb, bus, rate })
    function noise(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const src = ctx.createBufferSource(); src.buffer = noiseBuf[p.color || 'white']; src.loop = true;
      if (p.rate) src.playbackRate.value = p.rate;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      const f = filterNode(p, t);
      if (f) { src.connect(f); f.connect(g); } else src.connect(g);
      out(g, p);
      const off = rand('off' + time + (p.f || ''))() * 2;
      src.start(t, off); src.stop(t + dur + 0.02);
    }

    // ---- named sounds. play(name, t, opts): opts.gain scales the whole sound, opts.pan places it.
    const S = {
      // UI / motion graphics
      pop: (t, o) => { tone(t, { f: [[0, o.f || 620], [0.07, (o.f || 620) * 0.45]], dur: 0.1, gain: 0.32 * o.g, pan: o.pan }); noise(t, { dur: 0.012, filter: 'highpass', f: 3000, gain: 0.12 * o.g, pan: o.pan }); },
      tick: (t, o) => noise(t, { dur: 0.018, filter: 'bandpass', f: o.f || 4200, q: 2.5, gain: 0.3 * o.g, pan: o.pan }),
      click: (t, o) => { tone(t, { f: o.f || 1900, type: 'square', dur: 0.02, gain: 0.08 * o.g, filter: 'lowpass', f2: 3000, pan: o.pan }); noise(t, { dur: 0.01, filter: 'highpass', f: 2500, gain: 0.15 * o.g, pan: o.pan }); },
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      blip: (t, o) => tone(t, { f: o.f || 'E6', type: o.type || 'square', dur: o.dur || 0.07, gain: 0.07 * o.g, a: 0.002, hold: (o.dur || 0.07) * 0.6, pan: o.pan }),
      whoosh: (t, o) => { const d = o.dur || 0.45; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 350], [d * 0.55, o.top || 2600], [d, 700]], q: 0.9, gain: 0.32 * o.g, a: d * 0.5, pan: o.pan, verb: 0.15 }); },
      swish: (t, o) => { const d = o.dur || 0.18; noise(t, { dur: d, filter: 'highpass', f: [[0, 1800], [d, 5200]], q: 0.7, gain: 0.22 * o.g, a: d * 0.35, pan: o.pan }); },
      riser: (t, o) => { const d = o.dur || 0.8; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 300], [d, 4000]], q: 1.2, gain: 0.25 * o.g, a: d * 0.95, pan: o.pan, verb: 0.2 }); tone(t, { f: [[0, 180], [d, 720]], type: 'triangle', dur: d, gain: 0.06 * o.g, a: d * 0.9 }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },
      impact: (t, o) => { S.thud(t, o); noise(t, { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 2400], [0.6, 300]], gain: 0.3 * o.g, verb: 0.35, pan: o.pan }); },
      stamp: (t, o) => { S.thud(t, { ...o, f: 160 }); noise(t, { dur: 0.05, filter: 'bandpass', f: 1300, q: 1.2, gain: 0.4 * o.g, pan: o.pan }); noise(t + 0.004, { dur: 0.012, filter: 'highpass', f: 3500, gain: 0.25 * o.g, pan: o.pan }); },

// contenido de la página que se dibuja dentro de la ventana (beat 7); A = opacidad global
function wire(ctx, t, A) {
  const R = (a, b) => eo(a, b, t);

    ctx.save(); ctx.globalAlpha = A * p;

    [[172, C.cyan], [196, C.violet], [220, C.magenta]].forEach(([x, c]) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, 218, 6, 0, 6.283); ctx.fill(); });
    ctx.restore();

  p = R(18.3, 18.7);

    const hG = ctx.createLinearGradient(150, 252, 750, 402); hG.addColorStop(0, rgb(C.cyan, 0.42)); hG.addColorStop(1, rgb(C.violet, 0.42));

    ctx.fillStyle = 'rgba(255,255,255,0.42)'; rr(ctx, 180, 322, 380 * p, 14, 7); ctx.fill();
    ctx.restore();
  }
  p = ebk(18.9, 19.3, t);
  if (p > 0) {
    ctx.save(); ctx.globalAlpha = A * cl(p * 2); ctx.translate(248, 370); ctx.scale(p, p); ctx.translate(-248, -370);
    const bG = ctx.createLinearGradient(180, 0, 320, 0); bG.addColorStop(0, C.cyan); bG.addColorStop(1, C.blue);
    ctx.fillStyle = bG; rr(ctx, 180, 354, 136, 32, 16); ctx.fill();
    ctx.restore();

    const q = R(19.0 + i * 0.2, 19.3 + i * 0.2); if (q <= 0) return;

    ctx.fillStyle = rgb(i === 1 ? C.violet : C.cyan, 0.5); rr(ctx, x + 18, 440, 70, 12, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; rr(ctx, x + 18, 468, 150, 10, 5); ctx.fill(); rr(ctx, x + 18, 490, 120, 10, 5); ctx.fill();
    ctx.restore();
  });
}

function explainer(ctx, W, Hh, t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; ctx.letterSpacing = '0px';
  ctx.clearRect(0, 0, W, Hh);

  const camX = 80 * eo(2, 17, t) + 140 * eio(17.2, 19, t) - 220 * eio(20.6, 21.4, t);
  background(ctx, W, Hh, t, camX, 0.45 + 0.55 * eo(0, 0.8, t));
  const cam = 1 + 0.02 * eo(1, 17, t) + 0.05 * eio(17.2, 19.4, t) - 0.075 * eio(20.6, 21.4, t);
  const sF = 1 - eo(X.sceneOut[0], X.sceneOut[1], t);          // desvanecimiento de la escena del recorrido
  const hitB = bump(t, X.hit, 3.2);

  ctx.save();
  ctx.translate(W / 2, Hh / 2); ctx.scale(cam, cam); ctx.translate(-W / 2 + 4 * Math.sin(t * 0.55), -Hh / 2 + 3 * Math.cos(t * 0.47));

  // ------------------------------------------------ beat 1: hook (globo + titular)
  const tOut = eo(X.outTitle[0], X.outTitle[1], t);
  if (t < 2.5) {
    ctx.save(); ctx.globalAlpha = 1 - tOut; ctx.translate(0, -30 * tOut);
    eyebrow(ctx, 'INTERNET EXPLICADO', 640, 386, { a: eo(0.45, 0.8, t), align: 'center', size: 28 });
    revealLine(ctx, '¿Cómo llega una web', 640, 486, 78, seg(0.4, 1.1, t), { align: 'center' });
    revealLine(ctx, 'a tu pantalla?', 640, 572, 78, seg(0.65, 1.35, t), { align: 'center' });
    ctx.restore();
  }

  // ------------------------------------------------ beat 2: el globo vuela y se vuelve el navegador
  const popG = ebk(X.globe[0], X.globe[1], t), fl = eio(X.fly[0], X.fly[1], t), crossA = eo(X.cross[0], X.cross[1], t);
  const hx = lerp(640, BR.x, fl), hy = lerp(230, BR.y, fl), hs = lerp(170, BR.s, fl);
  if (t < 2.8) {
    for (let i = 0; i < 2; i++) { const q = fract((t - 0.5) * 0.8 + i * 0.5); if (t > 0.5) ring(ctx, hx, hy, hs * 0.6 + q * 120, i ? C.violet : C.cyan, 0.35 * (1 - q) * (1 - fl)); }
    tile(ctx, hx, hy, hs, 'globe', { sc: popG, a: cl(popG * 2) * (1 - crossA), glow: 1.5 + 1.8 * bump(t, 0.5, 4) + 0.4 * Math.sin(t * 3), col: COL.globe, draw: eo(0.3, 1.1, t) });
  }
  const lateTile = t >= 19.9;
  const brA = lateTile ? eo(21.0, 21.35, t) : crossA * (1 - eo(X.card[0], X.card[0] + 0.45, t));
  tile(ctx, lateTile ? ROW_X[0] : hx, lateTile ? 290 : hy, lateTile ? 130 : hs, 'browser', { a: brA, glow: BRglow(t), col: COL.br });
  if (t < 17.9) pill(ctx, BR.x, BR.y + 112, 'Navegador', { size: 30, col: COL.br, a: eo(X.brLab[0], X.brLab[1], t) * sF });

  // barra de dirección: se escribe la URL y luego se contrae en una píldora
  const uin = eo(X.urlIn[0], X.urlIn[1], t), uout = eio(X.urlOut[0], X.urlOut[1], t);
  if (uin > 0.003 && uout < 0.999) {
    const c0 = ptAt(DNSQ, 0.08);

    ctx.translate(660 + (c0.x - 660) * uout, 440 + (c0.y - 440) * uout);
    const sc = 1 - 0.75 * uout; ctx.scale(sc, sc); ctx.translate(-660, -440);
    ctx.globalAlpha = uin * (1 - uout);
    card(ctx, 340, 385, 640, 110, { r: 26, acc: [C.cyan, C.blue], flash: 0.35 * bump(t, X.type[1], 4) + 0.15 });
    eyebrow(ctx, 'DIRECCIÓN', 372, 428, { size: 28 });
    const typed = 'ejemplo.com'.slice(0, Math.min(11, Math.floor(11 * seg(X.type[0], X.type[1], t) + 0.0001)));
    const w = gtext(ctx, typed, 372, 480, 56, { cols: GRAD_HEAD });
    if (t < X.type[1] + 0.1 || fract(t * 2.2) < 0.65) { ctx.fillStyle = C.cyan; ctx.fillRect(372 + w + 8, 436, 4, 48); }
    ctx.restore();
  }

  // ------------------------------------------------ beats 3-6: el recorrido (se desvanece antes de la página)
  if (t < 17.9) {
    // ---- beat 3: DNS
    const dim = 1 - 0.72 * eio(X.dnsDim[0], X.dnsDim[1], t);
    const dnsPop = ebk(X.dnsIn[0], X.dnsIn[1], t);
    const rideU = lerp(0.08, 0.98, E.inOut(seg(X.ride[0], X.ride[1], t)));
    const pPos = ptAt(DNSQ, rideU);
    const rideOn = t > X.ride[0] && t < X.ride[1] + 0.05;
    connector(ctx, DNSQ, { draw: eio(X.dnsLine[0], X.dnsLine[1], t), col: [C.cyan, C.violet], a: dim * sF, lw: 2, pulses: rideOn ? [rideU] : [] });
    if (t > X.back[0] && t < X.back[1] + 0.15) pulseOn(ctx, DNSQ_R, seg(X.back[0], X.back[1], t) * 1.1, '#a6ffe0', 0.16, dim * sF);
    if (t > X.resolve) { const q = 1 - bump(t, X.resolve, 3); ring(ctx, DNS.x, DNS.y, 70 + q * 110, C.green, 0.7 * (1 - q) * dim * sF, 3); }
    tile(ctx, DNS.x, DNS.y, DNS.s, 'pin', { sc: dnsPop, a: cl(dnsPop * 2) * dim * sF, glow: 1 + 1.5 * bump(t, 5.1, 4) + 1.4 * bump(t, X.resolve, 4), col: COL.dns, draw: eo(5.0, 5.7, t) });
    pill(ctx, DNS.x, DNS.y - 100, 'DNS', { size: 30, col: COL.dns, dot: true, a: eo(X.dnsLab[0], X.dnsLab[1], t) * dim * sF });
    pill(ctx, pPos.x, pPos.y, 'ejemplo.com', { size: 30, a: eo(X.pillIn[0], X.pillIn[1], t) * (1 - eo(X.resolve, X.resolve + 0.25, t)) });

    // ---- IP: nace en el DNS y vuela a ser la etiqueta del servidor
    const ipP = ebk(X.ipPop[0], X.ipPop[1], t), ipF = eio(X.ipFly[0], X.ipFly[1], t);
    const ipX = lerp(DNS.x, SV.x, ipF), ipY = lerp(DNS.y + 112, SV.y - 112, ipF) - 70 * Math.sin(Math.PI * ipF);
    pill(ctx, ipX, ipY, '203.0.113.42', { size: lerp(36, 30, ipF), col: [C.green, C.cyan], dot: true, sc: ipP, a: cl(ipP * 2) * (1 - eo(X.ipOut[0], X.ipOut[1], t)) });

    // ---- beat 4: servidor + petición
    const svPop = ebk(X.svIn[0], X.svIn[1], t);
    const bld = eo(X.build[0], X.build[0] + 0.4, t) * (1 - eo(X.build[1] - 0.4, X.build[1], t));
    const svGlow = 1.2 + 1.5 * bump(t, 8.7, 4) + 2.0 * bump(t, X.reqHit, 3.5) + 1.8 * bld + 0.3 * Math.sin(t * 3) * bld + 1.0 * bump(t, X.build[1], 5);
    for (let i = 0; i < 2; i++) { const q = fract((t - X.build[0]) * 0.7 + i * 0.5); ring(ctx, SV.x, SV.y, 112 + q * 50, i ? C.violet : C.cyan, 0.32 * (1 - q) * bld); }
    if (t > X.reqHit) { const q = 1 - bump(t, X.reqHit, 3); ring(ctx, SV.x, SV.y, 90 + q * 70, C.cyan, 0.7 * (1 - q) * sF, 3); }
    tile(ctx, SV.x, SV.y, SV.s, 'server', { sc: svPop, a: cl(svPop * 2) * sF, glow: svGlow, col: COL.sv, draw: eo(8.6, 9.2, t) });
    pill(ctx, SV.x, SV.y + 112, 'Servidor', { size: 30, col: COL.sv, a: eo(X.svLab[0], X.svLab[1], t) * sF });
    const reqA = (1 - 0.6 * eo(11.2, 11.6, t)) * (1 - 0.25 * eo(X.fileGo[0], X.fileGo[1], t)) * sF;
    const reqRideU = lerp(0.1, 0.8, E.inOut(seg(X.reqRide[0], X.reqRide[1], t)));
    const reqOn = t > X.reqRide[0] && t < X.reqRide[1] + 0.05;
    connector(ctx, REQ, { draw: eio(X.reqLine[0], X.reqLine[1], t), col: [C.cyan, C.violet], a: reqA, lw: 2, noEnds: true, pulses: reqOn ? [reqRideU + 0.06] : [] });
    const rp = ptAt(REQ, reqRideU);
    pill(ctx, rp.x, rp.y, 'Petición', { size: 30, a: eo(X.reqLab[0], X.reqLab[1], t) * (1 - eo(X.reqRide[1] - 0.1, X.reqRide[1] + 0.15, t)) });

    // ---- beat 5: el servidor arma HTML, CSS y JS
    FILES.forEach(([lab, cx, acc], i) => {
      const fs = X.files[i], p = ebk(fs, fs + 0.45, t), g = eio(X.fileGo[0], X.fileGo[1], t);
      const cA = (1 - eo(X.fileGo[0] + 0.25, X.fileGo[1], t));
      const lineOn = t < X.fileGo[0] + 0.2 ? 1 : 1 - eo(X.fileGo[0], X.fileGo[0] + 0.3, t);
      const pul = t > fs + 0.6 && t < X.fileGo[0] ? [fract((t - fs - 0.6) * 0.9 + i * 0.3)] : [];
      connector(ctx, FILE_P[i], { draw: eio(fs + 0.2, fs + 0.55, t), col: acc, noEnds: true, lw: 2, pulses: pul, a: lineOn * sF });
      if (p > 0.003 && cA > 0.003) {
        ctx.save(); ctx.translate(lerp(cx, SV.x, g), lerp(215, SV.y - 30, g)); ctx.scale(p * (1 - 0.7 * g), p * (1 - 0.7 * g)); ctx.globalAlpha *= cl(p * 2) * cA;

    for (let i = 0; i < 4; i++) {
      const f = (t - PK_START(i)) / X.pkT; if (f <= 0 || f >= 1) continue;

      const sc = (0.4 + 0.6 * E.out(cl(f / 0.12))) * (1 - 0.6 * E.in(cl((f - 0.85) / 0.15)));
      const a = cl(f / 0.06) * (1 - cl((f - 0.93) / 0.07)) * sF;
      ctx.save(); ctx.translate(pt.x, pt.y); ctx.scale(sc, sc); packet(ctx, 0, 0, PK_COLS[i], a); ctx.restore();
    }
    const okP = ebk(X.ok[0], X.ok[1], t);
    pill(ctx, 640, 545, '200 OK', { size: 34, col: [C.green, C.cyan], dot: true, sc: okP, a: cl(okP * 2) * sF });
  }

  // ------------------------------------------------ beat 7: la página se dibuja (el navegador se expande en una ventana)
  {
    const late = t >= 20;
    const ex = late ? 1 - eio(X.collapse[0], X.collapse[1], t) : eio(X.expand[0], X.expand[1], t);
    const from = late ? { x: ROW_X[0] - 65, y: 225, w: 130, h: 130 } : { x: BR.x - BR.s / 2, y: BR.y - BR.s / 2, w: BR.s, h: BR.s };
    const cardA = late ? 1 - eo(21.0, 21.35, t) : eo(X.card[0], X.card[1], t);

    pill(ctx, 450, 138, 'Navegador', { size: 30, col: COL.br, a: eo(X.navLab[0], X.navLab[1], t) * gone });
    if (t > 18.2 && gone > 0.003) {
      ctx.save(); ctx.globalAlpha = gone;
      eyebrow(ctx, 'CARGA', 850, 300, { a: eo(18.2, 18.55, t), size: 28 });
      const v = 0.8 * E.out(seg(X.num[0], X.num[1], t));

      ctx.restore();
      if (t > X.hit) for (let i = 0; i < 2; i++) { const q = 1 - bump(t, X.hit + i * 0.12, 2.5); ring(ctx, 980, 380, 80 + q * 260, i ? C.violet : C.cyan, 0.7 * (1 - q), 3); }
      ctx.restore();

  // ------------------------------------------------ beat 8: la cámara se aleja y revela el recorrido completo
  if (t > 21.1) {
    ROW_P.forEach((P, i) => {
      const pul = t > 22.1 ? [fract((t - 22.1) * 0.6 + i * 0.3)] : [];
      connector(ctx, P, { draw: eio(X.rowLines + i * 0.15, X.rowLines + 0.5 + i * 0.15, t), col: [ROW_COL[i][0], ROW_COL[i + 1][0]], lw: 2.2, noEnds: true, pulses: pul });
    });

      const p = ebk(X.rowIn[i - 1], X.rowIn[i - 1] + 0.5, t);
      tile(ctx, ROW_X[i], 290, 130, ROW_ICON[i], { sc: p, a: cl(p * 2), col: ROW_COL[i], glow: 1.6 + 0.15 * Math.sin(t * 3 + i) + (i === 3 ? 1.4 * bump(t, 22.4, 3) : 0), draw: eo(X.rowIn[i - 1] + 0.1, X.rowIn[i - 1] + 0.6, t) });
    }
    for (let i = 0; i < 4; i++) pill(ctx, ROW_X[i], 396, ROW_LAB[i], { size: 30, col: ROW_COL[i], a: eo(21.3 + i * 0.2, 21.6 + i * 0.2, t) });
  }
  if (t > 22.1) {
    const tkCols = ['#ffffff', '#e4f8ff', '#9fe6ff', '#8ff5d0'];
    const tl = revealLine(ctx, 'Todo en menos de un segundo', 640, 570, 64, seg(X.tk[0], X.tk[1], t), { align: 'center', cols: tkCols });
    const ul = eio(X.ul[0], X.ul[1], t);
    if (ul > 0) {
      ctx.save(); const ug = ctx.createLinearGradient(640 - tl.w / 2, 0, 640 + tl.w / 2, 0); ug.addColorStop(0, rgb(C.cyan, 0)); ug.addColorStop(0.3, C.cyan); ug.addColorStop(0.7, C.violet); ug.addColorStop(1, rgb(C.violet, 0));
      ctx.strokeStyle = ug; ctx.lineWidth = 3; ctx.lineCap = 'round'; const hw = tl.w / 2 * ul; ctx.beginPath(); ctx.moveTo(640 - hw, 596); ctx.lineTo(640 + hw, 596); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter'; glowDot(ctx, 640 + hw, 596, C.cyan, 20, 1 - ul * 0.6); glowDot(ctx, 640 - hw, 596, C.violet, 20, 1 - ul * 0.6);
      ctx.restore();
    }
  }
  ctx.restore();

  // ------------------------------------------------ encabezado y subtítulos (fuera de la cámara)
  headerAnim(ctx, t);
  captionsAnim(ctx, t);

  bloom(ctx, 1);
  H.vignette(ctx, W, Hh, 0.45, '2,3,16');
}

// =====================================================================================================
// SONIDO: sin voz en off, mezcla completa. Los tiempos salen de las mismas constantes X que la imagen.
// =====================================================================================================
function scoreSound(k) {
  const D = X.D;
  const whoosh = (t, dur, g = 1, top = 1500, o = {}) => k.noise(t, { dur, color: 'pink', filter: 'bandpass', f: [[0, 260], [dur * 0.55, top], [dur, 420]], q: 0.8, gain: 0.16 * g, a: dur * 0.5, verb: 0.2, pan: o.pan || 0, minor: o.minor });
  const glass = (t, f, g = 1, o = {}) => {
    k.tone(t, { f, dur: 0.5, gain: 0.13 * g, a: 0.003, verb: 0.35, pan: o.pan || 0, minor: o.minor });
    k.tone(t, { f: f * 2, dur: 0.18, gain: 0.035 * g, a: 0.002, verb: 0.3, pan: o.pan || 0, minor: o.minor });
    k.tone(t, { f: f / 2, type: 'triangle', dur: 0.12, gain: 0.08 * g, a: 0.002, pan: o.pan || 0, minor: o.minor });
  };
  const tick = (t, g = 1, f = 1700) => {
    k.noise(t, { dur: 0.016, filter: 'bandpass', f, q: 3, gain: 0.36 * g, a: 0.001, pan: 0.15, minor: true });
    k.tone(t, { f: f * 0.55, dur: 0.035, gain: 0.065 * g, a: 0.001, pan: 0.15, minor: true });
  };
  const glide = (t, dur, f0, f1, g = 1, type = 'sine') => k.tone(t, { f: [[0, f0], [dur, f1]], type, dur: dur + 0.08, gain: 0.05 * g, a: dur * 0.4, hold: dur * 0.3, filter: 'lowpass', f2: 1400, verb: 0.25, minor: true });
  const counter = (val, a, b, gap, g, f) => { let last = -1, prev = val(a); for (let t = a; t <= b; t += 0.002) { const v = val(t); if (v !== prev && t - last >= gap) { tick(t, g, f); last = t; } prev = v; } };

  // ---- base ambiental suave (pad que resuelve en La mayor bajo el remate)
  k.music('pad', 0, 22.2, { bpm: 64, gain: 0.5, chords: [['A2', 'E3', 'B3', 'C4'], ['F2', 'C3', 'E3', 'A3'], ['D3', 'A3', 'C4', 'E4'], ['E2', 'B2', 'E3', 'G#3']] });
  k.music('pad', 22.2, D, { bpm: 64, gain: 0.5, chords: [['A2', 'E3', 'A3', 'C#4']] });

  // ---- beat 1: el globo rebota, el titular sube palabra por palabra
  whoosh(0.08, 0.4, 0.6);
  glass(0.36, 'A4', 1.1);
  whoosh(0.42, 0.75, 0.8, 1300);

  // ---- beat 2: el titular se va, el globo vuela y se vuelve navegador, se escribe la URL
  k.noise(X.outTitle[0], { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 300], [0.4, 900], [0.7, 300]], gain: 0.16, a: 0.3 });
  glass(X.fly[1], 'E4', 1.0, { pan: -0.6 });
  whoosh(X.urlIn[0], 0.35, 0.5, 1100, { minor: true });
  k.play('typing', X.type[0], { n: 11, rate: 0.082, gain: 0.55 });
  tick(X.type[1] + 0.05, 1.1, 1500); glass(X.type[1] + 0.1, 'E5', 0.7, { minor: true });

  // ---- beat 3: la dirección viaja al DNS y vuelve convertida en IP
  whoosh(X.urlOut[0], 0.4, 0.6, 1200);
  glass(X.dnsIn[0] + 0.2, 'C5', 0.9, { pan: 0.4 });
  glass(X.dnsLab[0], 'G5', 0.5, { pan: 0.4, minor: true });
  glide(X.ride[0], X.ride[1] - X.ride[0], 300, 700);
  for (let i = 0; i < 7; i++) tick(X.resolve + i * 0.06, 1.0, 1100 + i * 70);
  k.play('ding', X.ipPop[0] + 0.1, { f: 'E6', gain: 0.7, pan: 0.3 });
  whoosh(X.back[0], 0.4, 0.4, 1000, { minor: true });

  // ---- beat 4: la IP vuela, aparece el servidor y sale la petición
  whoosh(X.ipFly[0], 0.7, 0.7, 1300);
  glass(X.svIn[0] + 0.2, 'E4', 1.1, { pan: 0.6 });
  glass(X.svLab[0], 'B4', 0.5, { pan: 0.6, minor: true });
  whoosh(X.reqLine[0], 0.5, 0.5, 1100, { minor: true });
  glide(X.reqRide[0], X.reqRide[1] - X.reqRide[0], 260, 620);
  k.play('thud', X.reqHit, { f: 110, gain: 0.5, pan: 0.5 });

  // ---- beat 5: el servidor arma HTML, CSS y JS
  k.tone(X.build[0], { f: [[0, 110], [1.2, 220]], type: 'triangle', dur: 1.3, gain: 0.05, a: 0.3, filter: 'lowpass', f2: 900, verb: 0.2 });
  ['E4', 'A4', 'B4'].forEach((n, i) => glass(X.files[i] + 0.2, n, 0.9, { pan: 0.2 - i * 0.2 }));
  glass(X.files[2] + 0.55, 'E5', 0.5, { pan: 0.6, minor: true });

  // ---- beat 6: los archivos regresan en paquetes
  whoosh(X.fileGo[0], 0.5, 0.8, 1200);
  k.play('success', X.ok[0] + 0.05, { gain: 0.7, pan: 0.2 });
  for (let i = 0; i < 4; i++) {
    tick(PK_START(i) + 0.05, 0.8, 1500);
    k.tone(ARRIVALS[i], { f: i % 2 ? 'A3' : 'E3', dur: 0.22, gain: 0.07, a: 0.004, verb: 0.3, pan: -0.6, minor: true });
  }
  glide(X.pk0 + 0.2, 1.6, 320, 680, 0.8);
  whoosh(ARRIVALS[3] - 0.1, 0.4, 0.6, 1300, { pan: -0.4 });

  // ---- beat 7: empuje de cámara, la página se dibuja, cuenta hasta 0.8 s
  whoosh(X.sceneOut[0], 0.8, 1.2, 1700);
  [[18.1, 700], [18.3, 640], [18.6, 760], [19.0, 560], [19.2, 600], [19.4, 640]].forEach(([tt, f]) => k.play('pop', tt + 0.05, { f, gain: 0.4, pan: -0.3, minor: true }));
  glass(18.95, 'E5', 0.6, { minor: true });
  counter((t) => Math.round(80 * E.out(seg(X.num[0], X.num[1], t))), X.num[0] + 0.02, X.num[1], 0.085, 0.8, 1600);
  k.noise(X.hit - 0.85, { dur: 0.85, color: 'pink', filter: 'bandpass', f: [[0, 180], [0.85, 1300]], q: 1, gain: 0.2, a: 0.8, verb: 0.2 });
  k.tone(X.hit - 0.85, { f: [[0, 110], [0.85, 220]], type: 'triangle', dur: 0.85, gain: 0.05, a: 0.8, filter: 'lowpass', f2: 900 });
  k.tone(X.hit, { f: [[0, 72], [0.6, 38]], dur: 1.3, gain: 0.7, a: 0.004 });
  k.play('thud', X.hit, { f: 105, gain: 0.8 });
  k.noise(X.hit, { dur: 0.5, color: 'brown', filter: 'lowpass', f: 320, gain: 0.3 });
  ['E5', 'B5', 'E6', 'G#6'].forEach((n, i) => k.tone(X.hit + 0.03 + i * 0.045, { f: n, dur: 1.6, gain: 0.032, a: 0.02, verb: 0.55, pan: (i - 1.5) * 0.35 }));
  k.noise(X.hit + 0.02, { dur: 1.1, color: 'pink', filter: 'highpass', f: [[0, 3000], [1.1, 6000]], gain: 0.035, a: 0.06, verb: 0.4 });

  // ---- beat 8: se aleja la cámara, cuatro íconos, el remate resuelve
  whoosh(X.collapse[0], 0.5, 0.8, 1200);
  ['E4', 'G4', 'A4'].forEach((n, i) => glass(X.rowIn[i] + 0.2, n, 0.8, { pan: -0.3 + i * 0.3 }));
  whoosh(X.tk[0], 0.45, 0.6, 1300, { minor: true });
  ['A3', 'E4', 'A4', 'C#5'].forEach((n, i) => k.tone(X.tk[0] + 0.32 + i * 0.03, { f: n, type: i ? 'sine' : 'triangle', dur: 1.7, gain: 0.085, a: 0.015, verb: 0.45, pan: (i - 1.5) * 0.25 }));
  k.noise(X.ul[0], { dur: 0.45, filter: 'bandpass', f: [[0, 900], [0.45, 1800]], q: 1.2, gain: 0.05, a: 0.2, minor: true });
}

// ---- para renderizar cuadro a cuadro a video más adelante
window.FONT_SAMPLE = '¿?¡!áéíóúñÁÉÍÓÚÑ0123456789.%<·';
window.fontsReady = (async () => {
  const specs = ['700 80px "Space Grotesk"', '400 20px "Space Grotesk"', '600 26px "Inter"', '400 22px "Inter"'];
  try { await Promise.all(specs.map((f) => document.fonts.load(f, 'AaZz09' + window.FONT_SAMPLE))); await document.fonts.ready; } catch (e) { /* dibuja igual */ }
})();
window.seek = (tt) => { explainer(document.getElementById('cv').getContext('2d'), 1280, 720, tt); };
window.DURATION = DURATION;
window.scoreSound = scoreSound;

// =====================================================================================================
// REPRODUCTOR
// =====================================================================================================
(async function () {
  await window.fontsReady;

  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const playBtn = $('play'), scrub = $('scrub'), timeEl = $('time'), sndBtn = $('snd'), loopEl = $('loop'), big = $('big');
  let t = 0, playing = false, last = 0, stopSound = () => {}, soundOn = true, restartTimer = 0;

  const draw = () => {
    explainer(ctx, 1280, 720, t);
    scrub.value = String(Math.round(t * 1000));
    timeEl.textContent = t.toFixed(1) + ' / ' + DURATION.toFixed(1) + ' s';
  };

  const startSound = () => { stopSound(); stopSound = () => {}; if (soundOn && playing) stopSound = SOUND.live(scoreSound, t, { voiceover: false }); };
  const play = () => { playing = true; last = performance.now(); playBtn.textContent = '❚❚'; playBtn.setAttribute('aria-label', 'Pausa'); startSound(); };
  const pause = () => { playing = false; playBtn.textContent = '▶'; playBtn.setAttribute('aria-label', 'Reproducir'); stopSound(); stopSound = () => {}; };

  const frame = (now) => {
    if (playing) {
      t += (now - last) / 1000; last = now;
      if (t >= DURATION) {
        if (loopEl.checked) { t = 0; startSound(); } else { t = DURATION; pause(); }
      }
      draw();
    }
    requestAnimationFrame(frame);
  };

  playBtn.addEventListener('click', () => { if (big.style.display !== 'none') { big.click(); return; } playing ? pause() : play(); });
  big.addEventListener('click', () => { big.style.display = 'none'; t = 0; draw(); play(); });
  scrub.addEventListener('input', () => {
    t = Number(scrub.value) / 1000; draw(); stopSound(); stopSound = () => {};
    if (playing) { last = performance.now(); clearTimeout(restartTimer); restartTimer = setTimeout(() => { last = performance.now(); startSound(); }, 150); }
  });
  sndBtn.addEventListener('click', () => {
    soundOn = !soundOn; sndBtn.textContent = soundOn ? 'Sonido: sí' : 'Sonido: no'; sndBtn.setAttribute('aria-pressed', String(soundOn));
    if (!soundOn) { stopSound(); stopSound = () => {}; } else if (playing) startSound();
  });
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playBtn.click(); } });

  t = 22.9; draw();            // cuadro de portada hasta que se pulse reproducir
  requestAnimationFrame(frame);
})();
</script>
